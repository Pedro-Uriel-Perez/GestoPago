# Perfil "test": pruebas de integracion con la app completa levantada,
# pero sin depender de servicios externos reales. Base de datos H2 en
# memoria (modo PostgreSQL) con un esquema equivalente al de produccion;
# GestoPago, Gmail y Redis se sustituyen por dobles de prueba en cada test.
spring.datasource.url=jdbc:h2:mem:compras;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.locations=classpath:db/migration-h2

spring.cache.type=none
spring.data.redis.password=no-se-usa-en-pruebas
spring.mail.username=pruebas@example.com
spring.mail.password=no-se-usa-en-pruebas
gestopago.auth.password=no-se-usa-en-pruebas
# gestopago.sendtx.secret-key / iv no se definen aqui: CompraIntegracionTest
# genera valores aleatorios en cada corrida (@DynamicPropertySource).

# Tareas programadas apagadas ("-" = cron deshabilitado) para que no
# corran solas durante las pruebas.
gestopago.productos.sync-cron=-
security.session.check-cron=-
gestopago.auth.refresh-rate-ms=86400000
