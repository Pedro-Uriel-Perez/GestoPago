# ── Servidor ──
server.port=8081

# La autenticacion real la hace JwtAuthenticationFilter/SecurityConfig contra
# la tabla logins; el UserDetailsService en memoria que Spring Security
# generaria por defecto no se usa para nada, asi que se desactiva.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ── PostgreSQL (instancia local ya instalada como servicio de Windows) ──
spring.datasource.url=jdbc:postgresql://localhost:5432/pagoservicios
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ──
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# ── Flyway (gestionado manualmente en FlywayConfig.java) ──
# Se desactiva la auto-configuracion de Flyway de Spring Boot para evitar que
# corra las migraciones por su cuenta ademas del bean manual "flyway" de
# FlywayConfig (que ya tiene @DependsOn desde ConfigDB).
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.table=flyway_schema_history

# ── Deshabilitar Config Server (no se usa uno externo en este entorno) ──
spring.cloud.config.enabled=false

# ── GestoPago Auth (Feign) — credenciales de demo de la especificacion PuntoRed ──
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
gestopago.auth.password=12345678
gestopago.auth.refresh-rate-ms=3600000

# --- Integracion servicio externo: Catalogo de Productos (GestoPago) ---
# Mismo host que gestopago.auth.url: el endpoint GET /sistema/service/getProductList.do
# pertenece al mismo servicio externo que ya autentica GestoPagoAuthClient, por lo que
# se reutiliza la misma propiedad de host en vez de definir una nueva.
# El Bearer Token tampoco se define aqui: se reutiliza el token ya obtenido y renovado
# por GestoPagoTokenServiceImpl a partir de gestopago.auth.* (ver GestoPagoProductListFeignConfig).

# Timeouts del cliente Feign para la consulta de lista de productos.
feign.client.config.gestoPagoProductList.connect-timeout=5000
feign.client.config.gestoPagoProductList.read-timeout=10000

# GestoPago solo permite invocar getProductList.do "una vez al dia" (maximo 3 veces
# en total antes de bloquear la IP), por lo que la sincronizacion corre una vez al dia
# a las 06:00. Para pruebas locales se puede cambiar temporalmente a
# "0 * * * * *" (cada minuto) - regresar a "0 0 6 * * *" antes de entregar.
gestopago.productos.sync-cron=0 0 6 * * *


# --- Catalogo de productos: Postgres como fuente de verdad + Redis como cache ---
# GestoPagoProductListSyncServiceImpl guarda el catalogo en Postgres
# (gestopago_productos) una vez al dia e invalida el cache "productos" de
# Redis (@CacheEvict). ProductListServiceImpl (GET /productos) lee de Redis
# si esta disponible, o de Postgres en cache-miss (@Cacheable).
# Redis en la nube (Upstash) - requiere SSL.
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:stunning-aardvark-285457.upstash.io}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:gQAAAAAABFsRAAIgcDI2Yzk3MDZjMjU2YTM0MDBkODcwMTIwMTQ4N2FkZTk0ZA}
spring.data.redis.ssl.enabled=true
gestopago.productos.cache-ttl-hours=25

# --- Onboarding de Clientes: seguridad ---
# Clave para derivar (PBKDF2) la llave AES-256 que cifra correo, nombre, JWT
# y datos biometricos en la tabla "logins".
security.aes.secret-key=${AES_SECRET_KEY:GestoPago-Clientes-2026-ClaveSecreta!}

# Clave para firmar los JWT que emite el login de clientes, y su vigencia.
security.jwt.secret-key=${JWT_SECRET_KEY:GestoPago-Clientes-JWT-2026-ClaveSecretaLargaParaFirmarTokens!}
security.jwt.expiration-ms=3600000

# Cada cuanto se revisan las sesiones activas para cerrarlas por inactividad,
# y cuantos minutos sin actividad se consideran una sesion inactiva.
security.session.inactividad-minutos=5
security.session.check-cron=0 * * * * *
