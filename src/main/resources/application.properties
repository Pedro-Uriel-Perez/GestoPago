# --- Integracion servicio externo: Catalogo de Productos (GestoPago) ---
# Mismo host que gestopago.auth.url: el endpoint GET /sistema/service/getProductList.do
# pertenece al mismo servicio externo que ya autentica GestoPagoAuthClient, por lo que
# se reutiliza la misma propiedad de host en vez de definir una nueva.
# El Bearer Token tampoco se define aqui: se reutiliza el token ya obtenido y renovado
# por GestoPagoTokenServiceImpl a partir de gestopago.auth.* (ver GestoPagoProductListFeignConfig).

# Timeouts del cliente Feign para la consulta de lista de productos.
feign.client.config.gestoPagoProductList.connect-timeout=5000
feign.client.config.gestoPagoProductList.read-timeout=10000

# GestoPago solo permite invocar getProductList.do "una vez al dia" (maximo 3 veces
# en total antes de bloquear la IP), por lo que la sincronizacion corre una vez al dia
# a las 03:00 y el resultado se guarda en la tabla gestopago_productos.
gestopago.productos.sync-cron=0 0 3 * * *

# --- Cache de lectura (Redis) para el catalogo de productos ---
# Postgres (gestopago_productos) sigue siendo la fuente de verdad; Redis solo
# acelera las lecturas de GET /productos. Se invalida en cada sincronizacion
# diaria (@CacheEvict) y tiene un TTL de respaldo.
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
gestopago.productos.cache-ttl-hours=25
