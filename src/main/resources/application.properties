# --- Integracion servicio externo: Lista de Productos ---
# URL base del servicio externo (host distinto al de GestoPago).
productlist.api.url=${PRODUCTLIST_API_URL:http://localhost:8082}
# Bearer Token del servicio externo. Se obtiene de configuracion/variable de entorno,
# nunca debe quedar escrito (hardcodeado) en el codigo fuente.
productlist.api.token=${PRODUCTLIST_API_TOKEN:}

# Timeouts del cliente Feign para el servicio de lista de productos.
feign.client.config.productListClient.connect-timeout=5000
feign.client.config.productListClient.read-timeout=10000
